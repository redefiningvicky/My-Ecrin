<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5eee1">
    <meta name="description" content="A short My Écrin walkthrough.">
    <title>My Écrin — Your personal jewelry box</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5eee1;
        --ink: #332720;
        --muted: #74675d;
        --gold: #98712f;
        --line: #d9c9a9;
        --velvet: #28171b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        width: min(100% - 36px, 1080px);
        margin: 0 auto;
        padding: clamp(28px, 6vw, 64px) 0 36px;
        text-align: center;
      }

      .wordmark {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.6rem, 3vw, 2rem);
        font-weight: 400;
        letter-spacing: 0.01em;
      }

      .rule {
        width: 56px;
        height: 1px;
        margin: 18px auto 28px;
        border: 0;
        background: var(--gold);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--gold);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 400;
        line-height: 1.12;
        text-wrap: balance;
      }

      .intro {
        margin: 14px auto 28px;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.6;
      }

      figure {
        margin: 0 auto;
      }

      .video-frame {
        position: relative;
        width: min(100%, 370px);
        margin: 0 auto;
        padding: 29px 9px 22px;
        border: 2px solid #b49a61;
        border-radius: 38px;
        background: #24211f;
        box-shadow: 0 0 0 2px #ddcba2, inset 0 0 0 2px #4b4336, 0 14px 34px rgb(55 38 23 / 18%);
      }
      .phone-speaker {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        width: 30px; height: 5px; border-radius: 5px; background: #100f0e;
      }
      .phone-camera {
        position: absolute; top: 11px; left: calc(50% - 31px);
        width: 7px; height: 7px; border: 2px solid #121717; border-radius: 50%; background: #42565a;
      }
      .phone-buttons {
        position: absolute; top: 102px; left: -4px;
        width: 3px; height: 35px; border: 1px solid #887344; border-radius: 3px; background: #c5ae76;
        box-shadow: 0 46px 0 #c5ae76;
      }
      .video-frame::after {
        content: "•••••"; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
        color: #77643f; font-size: 9px; letter-spacing: 3px;
      }

      video {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 0;
        outline: 1px solid #8b7a53;
        background: var(--velvet);
        object-fit: contain;
      }

      figcaption {
        max-width: 36rem;
        margin: 12px auto 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.5;
      }

      .download {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin: 22px auto 0;
        padding: 0 22px;
        border: 1px solid var(--gold);
        border-radius: 999px;
        background: var(--gold);
        color: #fffaf0;
        font-size: 0.95rem;
        font-weight: 650;
        text-decoration: none;
        transition: background-color 140ms ease, color 140ms ease;
      }

      .download:hover {
        background: transparent;
        color: var(--ink);
      }

      .download:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 4px;
      }

      footer {
        margin-top: 42px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.6;
      }

      .footer-brand {
        margin: 0 0 10px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.1rem;
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px 24px;
      }

      .footer-links a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        color: var(--ink);
        text-underline-offset: 4px;
        text-decoration-thickness: 1px;
      }

      .footer-links a:hover {
        color: var(--gold);
      }

      .footer-links a:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 4px;
        border-radius: 2px;
      }

      @media (max-width: 480px) {
        .page {
          width: min(100% - 28px, 400px);
          padding-top: 26px;
        }

        .rule {
          margin-bottom: 24px;
        }

        .intro {
          margin-bottom: 22px;
        }

        .video-frame {
          width: min(100% - 12px, 330px);
          border-radius: 34px;
        }

        video {
          border-radius: 0;
        }
      }
      .player-controls { width:min(100%,370px); margin:18px auto 0; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; }
      .player-controls output { order:3; width:100%; }
      .player-controls input { order:4; }
      #fullscreen-toggle { min-width:112px; }
      .player-controls[hidden] { display:none; }
      .player-controls button { min-height:44px; padding:0 16px; border:1px solid var(--gold); border-radius:24px; background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
      #play-toggle { background:var(--gold); color:#fffaf0; min-width:112px; }
      .player-controls input { width:100%; height:24px; accent-color:var(--gold); cursor:pointer; }
      .player-controls output { font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums; }
      .player-controls :focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
      .phone-screen {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        isolation: isolate;
        background: #24211f;
        box-shadow: 0 0 0 1px #8b7a53;
      }
      .phone-screen video {
        border-radius: 18px;
        outline: none;
        clip-path: inset(0 round 18px);
      }
      .phone-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 1px rgba(36,33,31,.35);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <p class="wordmark">My Écrin</p>
        <hr class="rule">
        <p class="eyebrow">Walkthrough</p>
        <h1>Your personal jewelry box.</h1>
        <p class="intro">Rediscover your pieces. Create looks you love.</p>
      </header>

      <main>
        <figure>
          <div class="video-frame">
            <span class="phone-speaker" aria-hidden="true"></span>
            <span class="phone-camera" aria-hidden="true"></span>
            <span class="phone-buttons" aria-hidden="true"></span>
            <div class="phone-screen">
            <video
              controls
              muted
              playsinline
              preload="metadata"
              poster="myecrin-promo/video-poster.jpg"
              aria-label="My Écrin walkthrough video"
            >
              <source src="myecrin-promo/myecrin-walkthrough-tight-15s.mp4" type="video/mp4">
              <p>
                Video playback is not supported in this browser.
                <a href="myecrin-promo/myecrin-walkthrough-tight-15s.mp4">Open the MP4 file</a>.
              </p>
            </video>
            </div>
          </div>
          <div class="player-controls" hidden role="group" aria-label="Video playback controls">
            <button id="play-toggle" type="button" aria-label="Play walkthrough">▶ Play</button>
            <output id="playback-time" aria-label="Playback time">0:00 / 0:15</output>
            <button id="fullscreen-toggle" type="button" aria-label="Show video fullscreen">Full screen</button>
            <input id="video-progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek video" aria-valuetext="0:00">
          </div>
        </figure>
      </main>

      <footer>
        <p class="footer-brand">My Écrin — Your personal jewelry box.</p>
        <nav class="footer-links" aria-label="Footer">
          <a href="https://my-ecrin.vercel.app/">Launch My Écrin <span aria-hidden="true">↗</span></a>
          <a href="https://github.com/redefiningvicky/My-Ecrin">View the project on GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </footer>
    </div>
    <script>
      const video = document.querySelector('video');
      const controls = document.querySelector('.player-controls');
      const play = document.getElementById('play-toggle');
      const progress = document.getElementById('video-progress');
      const time = document.getElementById('playback-time');
      const format = value => Math.floor(value / 60) + ':' + String(Math.floor(value % 60)).padStart(2, '0');
      const sync = () => {
        const duration = Number.isFinite(video.duration) ? video.duration : 0;
        progress.value = duration ? video.currentTime / duration * 100 : 0;
        progress.setAttribute('aria-valuetext', format(video.currentTime));
        time.textContent = format(video.currentTime) + ' / ' + format(duration);
        play.textContent = video.ended ? '↻ Replay' : video.paused ? '▶ Play' : 'Ⅱ Pause';
        play.setAttribute('aria-label', video.ended ? 'Replay walkthrough' : video.paused ? 'Play walkthrough' : 'Pause walkthrough');
      };
      play.addEventListener('click', async () => {
        if (video.paused) { if (video.ended) video.currentTime = 0; try { await video.play(); } catch { video.controls = true; } }
        else video.pause();
      });
      progress.addEventListener('input', () => { if (Number.isFinite(video.duration)) video.currentTime = Number(progress.value) / 100 * video.duration; });
      document.getElementById('fullscreen-toggle').addEventListener('click', async () => {
        try { if (video.requestFullscreen) await video.requestFullscreen(); else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); } catch {}
      });
      ['loadedmetadata', 'timeupdate', 'play', 'pause', 'ended', 'volumechange'].forEach(event => video.addEventListener(event, sync));
      video.muted = true;
      video.defaultMuted = true;
      video.controls = false;
      controls.hidden = false;
      sync();
    </script>
  </body>
</html>
